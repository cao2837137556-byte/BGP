frr defaults traditional
hostname as3
log stdout
service integrated-vtysh-config
!
router bgp 3
 no bgp ebgp-requires-policy
 neighbor 172.16.23.2 remote-as 2
 neighbor 172.16.34.4 remote-as 4
 neighbor 172.16.35.5 remote-as 5
 !
 address-family ipv4 unicast
  neighbor 172.16.23.2 activate
  neighbor 172.16.34.4 activate
  neighbor 172.16.35.5 activate
 exit-address-family
!
line vty
